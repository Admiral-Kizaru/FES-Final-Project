<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Data Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Essential styles in case style.css is missing */
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card, .skeleton-card { border: 1px solid #e2e8f0; padding: 20px; border-radius: 12px; background: white; transition: 0.3s; }
        .card:hover { border-color: #2563eb; transform: translateY(-5px); cursor: pointer; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .skeleton-box { background: #f1f5f9; border-radius: 4px; margin-bottom: 10px; position: relative; overflow: hidden; height: 20px; }
        .skeleton-box::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, #ffffff, transparent); animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 100% { transform: translateX(100%); } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <span class="logo">DATA<span style="color:#2563eb">HUB</span></span>
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">Docs</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <header class="hero">
            <h1>Dynamic Resource Explorer</h1>
            <p>Fetching real-time data from external API endpoints.</p>
        </header>

        <section class="controls" style="display: flex; gap: 15px; margin-bottom: 30px;">
            <div class="search-wrapper" style="flex: 1;">
                <input type="text" id="searchInput" placeholder="Search by title..." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd;">
            </div>
            
            <div class="filter-wrapper">
                <select id="filterSelect" style="padding: 12px; border-radius: 8px; border: 1px solid #ddd;">
                    <option value="all">All IDs</option>
                    <option value="even">Even IDs Only</option>
                    <option value="odd">Odd IDs Only</option>
                </select>
            </div>
        </section>

        <div id="resultsGrid" class="results-grid">
            <!-- Skeletons appear here first -->
        </div>
    </main>

    <script>
        const grid = document.getElementById('resultsGrid');
        const searchInput = document.getElementById('searchInput');
        const filterSelect = document.getElementById('filterSelect');
        let allData = [];

        // 1. Show Skeletons
        function showSkeletons() {
            grid.innerHTML = Array(6).fill(0).map(() => `
                <div class="skeleton-card">
                    <div class="skeleton-box" style="width: 30%"></div>
                    <div class="skeleton-box" style="width: 80%; height: 30px"></div>
                    <div class="skeleton-box" style="width: 100%; height: 60px"></div>
                </div>
            `).join('');
        }

        // 2. Fetch Data (with error handling)
        async function loadData() {
            showSkeletons();
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com');
                if (!response.ok) throw new Error();
                allData = await response.json();
                // Artificial delay to appreciate the shimmer
                setTimeout(render, 1000);
            } catch (err) {
                // If API fails, use mock data so you can still see it work
                allData = [
                    { id: 1, title: "Database Optimization", body: "Learning how to scale backends." },
                    { id: 2, title: "React Components", body: "Building reusable UI blocks." },
                    { id: 3, title: "API Security", body: "How to protect your data endpoints." },
                    { id: 4, title: "Frontend Performance", body: "Making the web faster for everyone." },
                    { id: 5, title: "State Management", body: "Handling data flow in complex apps." },
                    { id: 6, title: "Modern CSS", body: "Mastering Grid, Flexbox, and Variables." }
                ];
                render();
            }
        }

        // 3. Render and Filter Logic
        function render() {
            const query = searchInput.value.toLowerCase();
            const filter = filterSelect.value;

            const filtered = allData.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(query);
                const isEven = item.id % 2 === 0;
                const matchesFilter = filter === 'all' ? true : (filter === 'even' ? isEven : !isEven);
                return matchesSearch && matchesFilter;
            }).slice(0, 6);

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; padding: 40px;">No results found.</p>`;
                return;
            }

            grid.innerHTML = filtered.map(item => `
                <div class="card" onclick="window.open('https://jsonplaceholder.typicode.com/${item.id}', '_blank')">
                    <span style="color: #2563eb; font-weight: bold; font-size: 12px;">ID #${item.id}</span>
                    <h3 style="margin: 10px 0; font-size: 18px;">${item.title.substring(0, 35)}...</h3>
                    <p style="color: #64748b; font-size: 14px;">${item.body.substring(0, 100)}...</p>
                </div>
            `).join('');
        }

        // Listeners
        searchInput.addEventListener('input', render);
        filterSelect.addEventListener('change', render);

        // Start
        loadData();
    </script>
</body>
</html>
