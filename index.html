<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Data Hub</title>
    <link rel="stylesheet" href="style.css">
    <!-- Icons -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <span class="logo">DATA<span>HUB</span></span>
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">Docs</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <header class="hero">
            <h1>Dynamic Resource Explorer</h1>
            <p>Fetching real-time data from external API endpoints.</p>
        </header>

        <section class="controls">
            <div class="search-wrapper">
                <i data-lucide="search"></i>
                <input type="text" id="searchInput" placeholder="Search by title...">
            </div>
            
            <div class="filter-wrapper">
                <select id="filterSelect">
                    <option value="all">All IDs</option>
                    <option value="even">Even IDs Only</option>
                    <option value="odd">Odd IDs Only</option>
                </select>
            </div>
        </section>

        <div id="loader" class="loader"></div>
        <div id="resultsGrid" class="results-grid">
            <!-- API Data Injected Here -->
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-grid">
            <div class="footer-info">
                <h3>DataHub</h3>
                <p>Clean. Fast. Dynamic.</p>
            </div>
            <div class="footer-links">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Contact</a>
            </div>
        </div>
        <div class="footer-bottom">
            &copy; 2026 DataHub API Project. 
        </div>
    </footer>

    <script src="javascript.js"></script>
</body>
</html>
